<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Estrai una scala casuale e studiane note, formula e diteggiature a 3 note per corda per chitarra.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Interval Master</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8821e'/%3E%3Cg stroke='%23fff' stroke-width='2'%3E%3Cpath d='M6 10h20M6 16h20M6 22h20'/%3E%3C/g%3E%3Ccircle cx='12' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-compact" id="open-settings" type="button" aria-controls="settings" aria-expanded="false" aria-label="Impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
    <h1 class="brand">Interval Master</h1>
    <button class="icon-btn only-compact-history" id="open-history" type="button" aria-controls="history" aria-expanded="false" aria-label="Cronologia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </header>

  <div class="backdrop" id="backdrop" hidden></div>

  <div class="layout">
    <!-- Impostazioni: drawer su mobile, colonna fissa su desktop -->
    <aside class="panel panel-left" id="settings" aria-label="Impostazioni">
      <div class="panel-head">
        <h2>Impostazioni</h2>
        <button class="icon-btn close-panel" type="button" data-close aria-label="Chiudi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <section class="group">
        <h3>Scale incluse</h3>
        <div id="families" class="checklist"></div>
        <div class="row-buttons">
          <button type="button" class="chip-btn" id="all-families">Tutte</button>
          <button type="button" class="chip-btn" id="no-families">Nessuna</button>
        </div>
      </section>

      <section class="group">
        <h3><label for="root-select">Tonica</label></h3>
        <select id="root-select"></select>
      </section>

      <section class="group">
        <h3>Opzioni</h3>
        <label class="check">
          <input type="checkbox" id="avoid-repeats">
          <span>Evita ripetizioni consecutive</span>
        </label>
        <label class="check">
          <input type="checkbox" id="quiz-mode">
          <span>Esercizio: nascondi le note<small>Mostra solo il nome: ricostruisci la scala, poi rivela la soluzione.</small></span>
        </label>
      </section>

      <p class="pool" id="pool-count"></p>
    </aside>

    <main class="main" id="main">
      <div class="draw-bar">
        <button type="button" class="draw-btn" id="draw">Scala casuale</button>
        <p class="hint">Scorciatoia: barra spaziatrice / Invio</p>
      </div>
      <p class="warning" id="empty-pool" hidden>Seleziona almeno una famiglia di scale.</p>

      <div id="result" aria-live="polite"></div>
    </main>

    <aside class="panel panel-right" id="history" aria-label="Cronologia">
      <div class="panel-head">
        <h2>Cronologia</h2>
        <button class="icon-btn close-panel" type="button" data-close aria-label="Chiudi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ol class="history-list" id="history-list"></ol>
      <p class="muted" id="history-empty">Nessuna estrazione precedente.</p>
    </aside>
  </div>

  <template id="tpl-empty">
    <div class="empty-state">
      <svg viewBox="0 0 120 64" aria-hidden="true">
        <g class="es-strings"><path d="M4 8h112M4 18h112M4 28h112M4 38h112M4 48h112M4 58h112"/></g>
        <g class="es-frets"><path d="M30 8v50M60 8v50M90 8v50"/></g>
        <circle cx="45" cy="28" r="6" class="es-root"/><circle cx="75" cy="38" r="6"/><circle cx="105" cy="18" r="6"/>
      </svg>
      <p>Premi <strong>Scala casuale</strong> per estrarre una scala tra 33 scale × 12 toniche.</p>
    </div>
  </template>

  <script src="js/theory.js"></script>
  <script src="js/guitar.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
